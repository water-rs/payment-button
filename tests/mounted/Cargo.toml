[package]
name = "waterui-payment-button-mounted-tests"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.100"
description = "Mounted semantic and runtime tests for waterui-payment-button"

[dev-dependencies]
waterui-payment-button = { path = "../.." }
waterui = { version = "0.5.2", default-features = false }
waterui-testing = { version = "0.5.1", default-features = false, features = ["gpu"] }
waterui-core = { version = "0.5.1", default-features = false }

# `waterui-testing` activates `waterui`'s default component features; align
# `waterui-apple`'s features during mounted-test compilation on Apple hosts.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
waterui-apple = { version = "0.1.0", git = "https://github.com/water-rs/waterui", branch = "main" }

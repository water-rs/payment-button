name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  release:
    name: Release unpublished packages
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: release-plz
          git: https://github.com/water-rs/release-plz
          rev: 3f421b280f377c2899f3a3750b4ad7a4f7e613c1
          locked: true
      - uses: release-plz/git-config@v0.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - run: >-
          release-plz release
          --git-token "${GITHUB_TOKEN}"
          --repo-url "https://github.com/${GITHUB_REPOSITORY}"
          --forge github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  release-pr:
    name: Prepare the next release
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: release-plz
          git: https://github.com/water-rs/release-plz
          rev: 3f421b280f377c2899f3a3750b4ad7a4f7e613c1
          locked: true
      - uses: release-plz/git-config@v0.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: release-plz
        run: |
          report=$(release-plz release-pr \
            --git-token "${GITHUB_TOKEN}" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            --forge github \
            -o json)
          echo "${report}"
          pr=$(jq -c '.prs[0] // empty' <<< "${report}")
          echo "pr=${pr}" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve the release PR's CI
        if: steps.release-plz.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: bash .github/scripts/approve-held-runs.sh "$(jq -er .number <<<"$PR")"

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  bump:
    name: Not a release bump
    if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} is not a release bump"

  apple:
    name: Apple / macOS, iOS & Mounted Tests
    needs: bump
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p waterui-payment-button --all-targets -- -D warnings
      - run: cargo clippy --locked -p payment-button-example --all-targets -- -D warnings
      - run: cargo clippy --locked -p waterui-payment-button-mounted-tests --all-targets -- -D warnings
      - run: cargo clippy --locked -p waterui-payment-button --target aarch64-apple-ios -- -D warnings
      - run: cargo clippy --locked -p waterui-payment-button --target aarch64-apple-ios-sim -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p waterui-payment-button
      - run: cargo nextest run --locked -p waterui-payment-button
      - run: cargo test --locked -p waterui-payment-button --test apple_button
      - run: cargo nextest run --locked -p waterui-payment-button-mounted-tests

  android:
    name: Android / aarch64-linux-android
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p waterui-payment-button --target aarch64-linux-android -- -D warnings
      - run: cargo clippy --locked -p payment-button-example --target aarch64-linux-android -- -D warnings

  unsupported:
    name: Unsupported Target Gate (Linux)
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p waterui-payment-button --target x86_64-unknown-linux-gnu
      - name: Verify example fails to compile on unsupported Linux target
        run: |
          if cargo check --locked -p payment-button-example --target x86_64-unknown-linux-gnu; then
            echo "::error::payment-button-example compiled on unsupported target x86_64-unknown-linux-gnu"
            exit 1
          fi

  msrv:
    name: MSRV
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: rustc --version && cargo --version
      - run: cargo check --locked -p waterui-payment-button --target aarch64-linux-android

  result:
    name: CI result
    if: always()
    needs: [bump, apple, android, unsupported, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "job results: $RESULTS"
          if [ "$FAILED" = "true" ]; then
            echo "::error::one or more jobs failed or were cancelled"
            exit 1
          fi

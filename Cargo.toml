[workspace]
members = ["examples/payment-button", "tests/mounted"]
resolver = "2"

[package]
name = "waterui-payment-button"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/payment-button"
description = "Official WaterUI native payment button plugin built on AppleView and AndroidView"
keywords = ["payment", "apple-pay", "google-pay", "waterui", "gui"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

# Request `com.apple.developer.in-app-payments` entitlement via the app's
# `[app_values] apple_pay_merchant_ids` declaration in `Water.toml`.
[[package.metadata.waterui.app-value]]
key = "apple_pay_merchant_ids"

[package.metadata.waterui.android]
kotlin-sources = ["android/PayButtonHelper.kt"]
maven = ["com.google.android.gms:play-services-wallet:20.0.0"]

[[package.metadata.waterui.android.meta-data]]
name = "com.google.android.gms.wallet.api.enabled"
value = true

[[package.metadata.waterui.android.keep]]
class = "dev.waterui.payment.PayButtonHelper"
members = [
    "public static android.view.View createContainer(android.content.Context, int, int, float, java.lang.String, long)",
    "public static void updateContainer(android.view.View, int, int, float, java.lang.String, long)",
    "public static void detachContainer(android.view.View)",
    "public static native void nativeOnClick(long)",
]

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "android"))'.dependencies]
nami = { version = "0.13", default-features = false }
waterui = { version = "0.5.2", default-features = false }
waterui-core = { version = "0.5.1", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-pass-kit = { version = "0.3.2", default-features = false, features = ["std", "PKPaymentButton", "PKConstants", "objc2-core-foundation"] }
waterui-apple = { version = "0.1.0", git = "https://github.com/water-rs/waterui", branch = "main", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-pass-kit = { version = "0.3.2", default-features = false, features = ["std", "PKPaymentButton", "PKConstants", "objc2-app-kit"] }

[target.'cfg(target_os = "android")'.dependencies]
hydrolysis = { version = "0.3.1", default-features = false }
jni = { version = "0.22", default-features = false }

[target.'cfg(target_os = "macos")'.dev-dependencies]
waterui-backend-core = { version = "0.5.2", default-features = false }

[[test]]
name = "apple_button"
harness = false

[patch.crates-io]
waterui-payment-button = { path = "." }

